# Site-level copy. Review counts/stars are injected from live data at build —
# never hardcoded here. review_wall stays EMPTY until Kennon supplies real,
# verified Amazon quotes (the wall renders nothing until then).
hero:
  headline: The pillow you adjust until it's yours.
  subline: >-
    Shredded memory foam you can add or remove until the loft matches how you
    actually sleep. GREENGUARD certified, machine-washable, and backed by a
    decade of verified Amazon reviews.
  cta_label: Shop the flagship pillow
  cta_href: /products/shredded-pillow/
trust:
  claims:
    - GREENGUARD certified foams
    - Lifetime warranty against defects
    - Removable, machine-washable covers
    - Sold and shipped by Amazon
flagship: shredded-pillow
why_us:
  - icon: adjust
    title: Adjustable by design
    body: >-
      Our flagship fill is shredded, not solid, so you set the loft — unzip,
      add or remove foam, done. No breaking-in period, no committing to a
      firmness you picked from a photo.
  - icon: certified
    title: Certified, not just claimed
    body: >-
      GREENGUARD certification on our pillows — third-party testing by UL
      Solutions for low chemical emissions, on record, not marketing
      language.
  - icon: amazon
    title: Checkout on Amazon
    body: >-
      Every purchase completes on Amazon.com — Prime shipping, Amazon returns,
      and years of public reviews you can read before you buy.
comparison_teaser:
  headline: Shredded foam versus everything else
  body: >-
    Solid foam holds one shape. Down flattens by morning. Shredded memory foam
    holds the shape you give it — see how the fills compare before you choose.
# Lifetime chosen deliberately (Kennon, 2026-08) — it exceeds the pillow
# industry's typical 5-year defect term (Coop, Tempur-Pedic, Stearns & Foster)
# and the 20-year claim on the body pillow's Amazon listing, so no
# longer-listing-period clause is needed. Coverage is defects only, never
# normal wear; the "lifetime of the product" definition in fine_print is
# load-bearing — do not remove it.
warranty:
  term: Lifetime Limited Warranty
  intro: >-
    Every Xtreme Comforts product is warranted against defects in materials
    and workmanship for as long as you own it. If something we made fails
    because we made it wrong, we replace it — that simple.
  covers:
    - Foam that splits, crumbles, or permanently collapses under normal use
    - Seams, stitching, or zippers that fail
    - Covers that tear along a seam or come apart despite washing per the care label
    - Any other flaw in materials or workmanship present when your product arrived
  excludes:
    - The gradual softening and flattening every pillow fill experiences with normal nightly use
    - Comfort preference — too firm, too soft, wrong loft. Inside Amazon's return window, Amazon's return policy covers this
    - Damage from misuse, improper washing or drying, pets, burns, cuts, or alterations
    - Stains, odors, or discoloration
    - Products purchased from anyone other than our official Amazon listings
  claim:
    intro: >-
      A claim takes one message — no receipts to dig up, your Amazon order ID
      is your proof of purchase.
    steps:
      - Find your order ID under Your Orders on Amazon.com
      - Reach out through our contact page with the order ID and a photo or two of the defect
      - If it's covered, we send a replacement at no charge
  fine_print:
    - This warranty covers the original purchaser with proof of purchase (your
      Amazon order ID) and is not transferable.
    - The remedy under this warranty is replacement with the same product, or a
      comparable current product if the original has been discontinued. Refunds
      are handled by Amazon's return policy during the return window, not by
      this warranty.
    - '"Lifetime" means the usable life of the product while owned by the
      original purchaser — it is a promise about how the product is made, not
      a promise that any pillow lasts forever. Coverage ends if the product is
      sold, given away, or replaced.'
    - This warranty gives you specific legal rights, and you may also have
      other rights which vary from state to state.
nav:
